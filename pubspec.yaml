name: thingboot_device
description: 芯步设备 Flutter SDK，通过统一 Dart API 将应用接入芯步平台，支持设备激活、MQTT 通信、配置管理、事件上报与私有化接入。
version: 0.4.0
repository: https://github.com/ThingBoot/thingboot-device-flutter-sdk
issue_tracker: https://github.com/ThingBoot/thingboot-device-flutter-sdk/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.0.0
  ffi: ^2.2.0
  crypto: ^3.0.3
  device_info_plus: ^10.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
