name: thingboot_device
description: 芯步设备 SDK Flutter 版（ThingBoot Device SDK for Flutter），以 ESP-IDF 为基准并包含闭源原生协议核心。
version: 0.2.0
repository: https://github.com/ThingBoot/thingboot-device-flutter-sdk
issue_tracker: https://github.com/ThingBoot/thingboot-device-flutter-sdk/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.0.0
  ffi: ^2.2.0
  crypto: ^3.0.3
  device_info_plus: ^10.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
