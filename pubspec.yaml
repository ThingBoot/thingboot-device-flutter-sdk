version: 0.1.0
repository: https://github.com/ThingBoot/thingboot-device-flutter
issue_tracker: https://github.com/ThingBoot/thingboot-device-flutter/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.0.0
  crypto: ^3.0.3
  http: ^1.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
